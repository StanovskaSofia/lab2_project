# docker compose up --build
services:
  api:
    build:
      context: .
      args:
        EPOCHS: ${EPOCHS:-10}
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    image: kws-api:${MODEL_VERSION:-1.0.0}
    ports: ["8000:8000"]
    environment:
      LOG_LEVEL: info
      UVICORN_WORKERS: "1"
    # обмеження ресурсів (завдання 3.7) та мінімальні привілеї (завдання 3.8)
    cpus: 1
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Стратегія B (завдання 3.4): образ без моделі + volume
  #   docker compose --profile external up api-external
  api-external:
    profiles: ["external"]
    build: {context: ., target: runtime-base}
    image: kws-api:nomodel
    ports: ["8001:8000"]
    volumes: ["./artifacts:/app/artifacts:ro"]
    environment:
      MODEL_PATH: /app/artifacts/model.pt

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on:
      api: {condition: service_healthy}

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ui:   # Streamlit з ЛР №1 (завдання 3.1) - розкоментуйте і вкажіть свій Dockerfile
