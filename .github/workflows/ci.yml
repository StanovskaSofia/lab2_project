name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acc_threshold:
        description: "Поріг accuracy, % (поставте 99, щоб показати червоний пайплайн)"
        default: "80"

env:
  IMAGE: kws-api
  EPOCHS: "5"                      # менше епох у CI для швидкості
  ACC_THRESHOLD: ${{ github.event.inputs.acc_threshold || '80' }}
  P95_LIMIT_MS: "100"              # ліміт p95 latency (клієнт), мс

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Lint
        run: |
          pip install ruff==0.5.0 requests numpy
          ruff check src/ scripts/

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            EPOCHS=${{ env.EPOCHS }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name kws -p 8000:8000 ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - name: Smoke test
        run: |
          curl -sf http://localhost:8000/model-info
          curl -sf -X POST -F "file=@samples/yes.wav" http://localhost:8000/predict
          # некоректний файл має давати 400, а не 500
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -F 'file=@README.md' http://localhost:8000/predict)" = "400"

      - name: Accuracy gate
        run: |
          ACC=$(curl -s http://localhost:8000/model-info | jq '.accuracy')
          echo "accuracy=$ACC threshold=$ACC_THRESHOLD"
          jq -en --argjson a "$ACC" --argjson t "$ACC_THRESHOLD" '$a >= $t' > /dev/null

      - name: Latency gate
        run: python scripts/benchmark.py --file samples/yes.wav --n 100 --max-p95-ms $P95_LIMIT_MS

      - name: Logs on failure
        if: failure()
        run: docker logs kws

      - name: Stop container
        if: always()
        run: docker rm -f kws || true
